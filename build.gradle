plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${minecraft_version}-${mod_version}-${tag_lanzador}"
group = mod_group_id

base {
    archivesName = mod_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = neo_version

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        configureEach {
            gameDirectory = file('run/')
            systemProperty 'fml.earlyprogresswindow', 'false'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            if (project.hasProperty("with_ponder")) {
                systemProperty "botania.ponder", "true"
            }
            def world = findProperty('vm_world') ?: 'world'
            if (world && file("run/saves/${world}").isDirectory()) {
                programArguments.addAll '--quickPlaySingleplayer', world.toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all', '--uncached',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', mod_id, '--all', '--uncached',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'assets/botania/patchouli_books/lexicon/en_us/README'
    exclude '.cache'
}

def createAdaptedJar = file(findProperty('create_adapted_jar') ?: 'dev_libs/create-adapted-26.1.2-1.31-public-external-assets.jar')
def hasCreateAdapted = createAdaptedJar.isFile()
def withCreate = project.hasProperty('with_create')
if (withCreate && !hasCreateAdapted) {
    throw new GradleException("-Pwith_create needs the Create: Adapted jar at ${createAdaptedJar} (or -Pcreate_adapted_jar=<path>)")
}
def createEmbeddedDir = file(findProperty('create_embedded_dir') ?: 'dev_libs/create-embedded')
def createEmbeddedTree = createEmbeddedDir.isDirectory()
        ? fileTree(createEmbeddedDir)
        : (hasCreateAdapted ? zipTree(createAdaptedJar) : files().asFileTree)
def createEmbedded = createEmbeddedTree.matching { include '**/*.jar' }
def createCompileEmbedded = createEmbeddedTree.matching { include '**/Registrate-*.jar', '**/flywheel-*.jar' }
if (!hasCreateAdapted) {
    sourceSets.main.java {
        exclude 'velrondevs/botania/integration/create/**'
    }
}
sourceSets.main.java {
    exclude 'velrondevs/botania/integration/arsnouveau/**'
    exclude 'velrondevs/botania/integration/botanypots/**'
    exclude 'velrondevs/botania/compat/spectrum/**'
}

repositories {
    mavenCentral()
    maven {
        name = 'ModdingX Maven'
        url = 'https://maven.moddingx.org/release'
        content {
            includeGroup 'org.moddingx'
        }
    }
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'vazkii.patchouli'
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'net.createmod.ponder'
            includeGroup 'net.createmod.catnip'
            includeGroup 'dev.engine-room.flywheel'
            includeGroup 'dev.engine-room.vanillin'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Curse Maven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'NovaCommittee'
        url = 'https://maven.nova-committee.cn/s3'
        content {
            includeGroup 'committee.nova.mods'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    implementation "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"

    compileOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
    compileOnly "maven.modrinth:sophisticated-storage:${sophisticated_storage_version}"
    compileOnly "maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}"
    runtimeOnly("maven.modrinth:sophisticated-core:${sophisticated_core_version}") { transitive = false }
    runtimeOnly("maven.modrinth:sophisticated-storage:${sophisticated_storage_version}") { transitive = false }
    runtimeOnly("maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version}") { transitive = false }

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "maven.modrinth:wthit:${wthit_version}"

    compileOnly "maven.modrinth:kubejs:${kubejs_version}"
    compileOnly "maven.modrinth:rhino:${rhino_version}"
    if (project.hasProperty("with_kubejs")) {
        runtimeOnly("maven.modrinth:kubejs:${kubejs_version}") { transitive = false }
        runtimeOnly("maven.modrinth:rhino:${rhino_version}") { transitive = false }
    }

    compileOnly "maven.modrinth:curios:${curios_version}"
    runtimeOnly "maven.modrinth:curios:${curios_version}"

    compileOnly "maven.modrinth:sodium:${sodium_version}"

    compileOnly "maven.modrinth:rei:${rei_version}"
    compileOnly "maven.modrinth:rrv:${rrv_version}"
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    compileOnly("net.createmod.catnip:catnip-neoforge:${ponder_version}") { transitive = false }
    compileOnly "maven.modrinth:cloth-config:26.1.154+neoforge"
    compileOnly "maven.modrinth:architectury-api:20.1.17+neoforge"
    if (project.hasProperty("with_ponder") && !withCreate) {
        runtimeOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
        runtimeOnly("net.createmod.catnip:catnip-neoforge:${ponder_version}") { transitive = false }
        runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge:${flywheel_version}") { transitive = false }
    }
    if (hasCreateAdapted) {
        compileOnly files(createAdaptedJar)
        compileOnly createCompileEmbedded
    }
    if (withCreate) {
        runtimeOnly files(createAdaptedJar)
        if (project.hasProperty("create_runtime_embedded")) {
            runtimeOnly createEmbedded
        }
    }

    if (!project.hasProperty("no_avaritia")) {
        compileOnly("${avaritia_dependency}") { transitive = false }
        runtimeOnly("${avaritia_dependency}") { transitive = false }
    }

    compileOnly "curse.maven:thaumaturge-1628024:${thaumaturge_file_id}"
    if (!project.hasProperty("no_thaumaturge")) {
        runtimeOnly "curse.maven:thaumaturge-1628024:${thaumaturge_file_id}"
        runtimeOnly "maven.modrinth:lithostitched:${lithostitched_version}"
    }
    compileOnly "maven.modrinth:lithostitched:${lithostitched_version}"

    compileOnly "maven.modrinth:fractal-lib:${fractal_version}"
    runtimeOnly "maven.modrinth:fractal-lib:${fractal_version}"

    if (!project.hasProperty("no_inventorysorter")) {
        implementation "curse.maven:inventory-sorter-240633:7940779"
    }
    if (!project.hasProperty("no_omnipots")) {
        implementation "curse.maven:omni-pots-1575756:8555242"
    }

    if (project.hasProperty("with_masterful")) {
        def masterfulJar = project.findProperty("masterful_jar") ?: "${rootDir}/../botania addons 26.1.2/masterful botany/build/libs/MasterfulBotany-26.1.2-1.0.1-NeoForge.jar"
        runtimeOnly files(masterfulJar)
        runtimeOnly("org.moddingx:LibX:${minecraft_version}-${libx_version}") { transitive = false }
    }

    compileOnly 'org.jetbrains:annotations:24.0.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-Xmaxerrs' << '100000'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version     : minecraft_version,
            neo_version           : neo_version,
            neo_version_range     : neo_version_range,
            loader_version_range  : loader_version_range,
            mod_name              : mod_name,
            mod_id                : mod_id,
            mod_version           : mod_version,
            mod_description       : mod_description,
            authors               : authors,
            background            : background,
            item_icon             : item_icon,
            issue_tracker         : issue_tracker,
            mod_license           : mod_license,
            patchouli_version     : patchouli_version,
            jei_version           : jei_version,
            jade_version          : jade_version.tokenize('+')[0],
            wthit_version         : wthit_version.tokenize('-').last(),
            sc_version            : sophisticated_core_version.tokenize('-')[1].tokenize('.').take(3).join('.'),
            ss_version            : sophisticated_storage_version.tokenize('-')[1].tokenize('.').take(3).join('.'),
            sb_version            : sophisticated_backpacks_version.tokenize('-')[1].tokenize('.').take(3).join('.'),
            kubejs_version        : kubejs_version.tokenize('+')[0],
            rhino_version         : rhino_version.tokenize('+')[0],
            rei_version           : rei_version.tokenize('+')[0],
            rrv_version           : rrv_version.tokenize('+')[0],
            ponder_version        : ponder_version.tokenize('+')[0],
            curios_version        : curios_version.tokenize('+')[0],
            sodium_version        : sodium_version.tokenize('-')[1],
            thaumaturge_version   : thaumaturge_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : 'vazkii',
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'vazkii',
        ])
    }
}

tasks.register('printCompileClasspath') {
    def cp = sourceSets.main.compileClasspath
    doLast {
        file('build/cp.txt').text = cp.files.join(File.pathSeparator)
    }
}
