modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${issue_tracker}"
logoFile="logo.png"

[[mods]]
modId="botania"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://botaniamod.net"
description="${mod_description}"
authors="${authors}"
itemIcon="${item_icon}" 
configBackground="${background}" 
rrv_client="velrondevs.botania.client.integration.rrv.BotaniaRrvPlugin"

[[mixins]]
config="botania.mixins.json"

[[mixins]]
config="botania_sophisticated.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="patchouli"
    type="required"
    versionRange="[${patchouli_version},)"
    ordering="NONE"
    side="BOTH"

